# dsh-sensenova-vision-aid bundle patch
#
# 通过 `dsh plugin --profile <name> add dsh-sensenova-vision-aid` 安装时,该声明会把
# 本包追加进 dsh.profile.bundles,profile 启动时合并此 patch(单一 insert 行)。
# `name` 必须是 scoped 全名(加载器按真实包名从 node_modules 解析),YAML 中以 @ 开头的
# 标量必须加引号,否则解析失败。
#
# ⚠️ 与 dsh-sensenova-freeapi 的条目 id `llm-sensenova` 刻意区分:本插件**不注册**
# provider 路由(子 agent 主路径依赖 freeapi 的 sensenova 适配器),条目 id 用
# `vision-sensenova` 避免设置命名空间冲突。可选的 profile 行内 config(优先级低于
# settings.yaml 的 vision-sensenova 段):
#
#   - insert:
#       - id: vision-sensenova
#         name: "dsh-sensenova-vision-aid"
#         config:
#           reuseFreeapiCredentials: true
#           keyRef: SENSENOVA_API_KEY
- insert:
    - id: vision-sensenova
      name: "dsh-sensenova-vision-aid"
      config:
        reuseFreeapiCredentials: true
        keyRef: SENSENOVA_API_KEY
